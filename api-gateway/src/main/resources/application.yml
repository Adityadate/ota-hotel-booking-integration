spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      HTTP:
        read-timeout: 30000
        write-timeout: 30000
        response-timeout: 60000

  # Resilience4j gateway settings
  cloud:
    gateway:
      resilience4j:
        route:
          default:
            enabled: true
            event-consumer-queue-size: 100

  # Actuator endpoints for observability
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,gateway
      endpoint:
        health:
          show-details: always

# Spring Cloud Gateway header propagation to downstream services
spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 30s
server:
  port: 8080
  shutdown: graceful

# Spring Cloud Gateway metrics
management:
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}
      service: gateway